static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080

    # Maximize buffer allocation for high-bandwidth streaming (32 MB per stream)
    per_stream_buffer_limit_bytes: 33554432

    # Enable socket options for immediate packet dispatch
    socket_options:
    - state: STATE_BOUND
      level: 6 # SOL_TCP
      name: 1  # TCP_NODELAY
      int_value: 1

    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          use_remote_address: true
          suppress_envoy_headers: true

          # Disable global timeouts on the proxy level for persistent streams
          stream_idle_timeout: 0s
          request_timeout: 0s

          # Extreme Downstream HTTP/2 Performance Settings
          http2_protocol_options:
            max_concurrent_streams: 2147483647
            initial_stream_window_size: 33554432     # 32 MB Stream Window
            initial_connection_window_size: 67108864 # 64 MB Connection Window
            override_stream_error_on_invalid_http_message: true
            connection_keepalive:
              interval: 10s
              timeout: 3s
              connection_idle_interval: 15s

          # HTTP/1.1 Options for WebSocket compatibility
          http_protocol_options:
            accept_http_10: true

          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:

              # --- WebSocket Routes ---
              - match:
                  prefix: "/trws"
                route:
                  cluster: xray_trojan_ws
                  timeout: 0s
                  idle_timeout: 0s
                  upgrade_configs:
                  - upgrade_type: websocket

              - match:
                  prefix: "/vlws"
                route:
                  cluster: xray_vless_ws
                  timeout: 0s
                  idle_timeout: 0s
                  upgrade_configs:
                  - upgrade_type: websocket

              # --- XHTTP Routes (Supports auto, stream-one, stream-up, packet-up) ---
              - match:
                  prefix: "/trxh"
                route:
                  cluster: xray_trojan_xh
                  timeout: 0s
                  idle_timeout: 0s
                  max_stream_duration:
                    max_stream_duration: 0s

              - match:
                  prefix: "/vlxh"
                route:
                  cluster: xray_vless_xh
                  timeout: 0s
                  idle_timeout: 0s
                  max_stream_duration:
                    max_stream_duration: 0s

          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # 1. Trojan WebSocket Backend (10086)
  - name: xray_trojan_ws
    connect_timeout: 0.25s
    type: STATIC
    lb_policy: ROUND_ROBIN
    upstream_connection_options:
      tcp_keepalive:
        keepalive_time: 10
        keepalive_interval: 3
        keepalive_probes: 3
    load_assignment:
      cluster_name: xray_trojan_ws
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 10086

  # 2. VLESS WebSocket Backend (10085)
  - name: xray_vless_ws
    connect_timeout: 0.25s
    type: STATIC
    lb_policy: ROUND_ROBIN
    upstream_connection_options:
      tcp_keepalive:
        keepalive_time: 10
        keepalive_interval: 3
        keepalive_probes: 3
    load_assignment:
      cluster_name: xray_vless_ws
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 10085

  # 3. Trojan XHTTP Backend (10087)
  - name: xray_trojan_xh
    connect_timeout: 0.25s
    type: STATIC
    lb_policy: ROUND_ROBIN
    upstream_connection_options:
      tcp_keepalive:
        keepalive_time: 10
        keepalive_interval: 3
        keepalive_probes: 3
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            max_concurrent_streams: 2147483647
            initial_stream_window_size: 33554432     # 32 MB Stream Window
            initial_connection_window_size: 67108864 # 64 MB Connection Window
            connection_keepalive:
              interval: 10s
              timeout: 3s
    load_assignment:
      cluster_name: xray_trojan_xh
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 10087

  # 4. VLESS XHTTP Backend (10088)
  - name: xray_vless_xh
    connect_timeout: 0.25s
    type: STATIC
    lb_policy: ROUND_ROBIN
    upstream_connection_options:
      tcp_keepalive:
        keepalive_time: 10
        keepalive_interval: 3
        keepalive_probes: 3
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            max_concurrent_streams: 2147483647
            initial_stream_window_size: 33554432     # 32 MB Stream Window
            initial_connection_window_size: 67108864 # 64 MB Connection Window
            connection_keepalive:
              interval: 10s
              timeout: 3s
    load_assignment:
      cluster_name: xray_vless_xh
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 10088
